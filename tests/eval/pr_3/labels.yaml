    line: 230
    match: ["convierte el chequeo de secreto llm en no-op"]
    why: "familia de P7: el `try/except` de insecure_secrets traga el YAML ilegible, pero un registro roto ya aborta el arranque en build_registry y el comentario lo documenta"

