# Gold set del PR #3 de agent-review-langgraph (spec 006 §5.2, E5).
#
# Procedencia: la review publicada en el PR #3 (hallazgos A-I) y la revision del
# codigo en 886f8d4 (= 008da57), que fijo los 7 hallazgos reales: A (#8) y los
# tres P1 de integracion (#1-#3) mas tres P2 de codigo (#5-#7). El `match` son
# frases distintivas de cada hallazgo; se afinan solo si un veredicto chirria
# (Q2). Las tres etiquetas: lo que debe salir (`expected`), lo que no
# (`must_not_report`, con motivo) y lo tolerable (`acceptable`).
case: pr-3-agent-review
repo: "pcgarat/agent-review-langgraph"
pr_id: 3
base_sha: a8ead73
head_sha: 008da57
captured_at: 2026-10-16
source: "auditoria manual: comentario publicado del PR #3 + revision del codigo en 886f8d4"

# E10: configuracion de `scope` del caso. La review auditada corrio con
# `max_files_per_pr: 10` (por churn), que dejo fuera docker-compose.yml, settings.py
# y worker/main.py, y con el corte a 60000 chars solo vio ~5 ficheros. Desde 012 esa
# guarda no existe: el `scope` prioriza y el `LlmReviewer` revisa por lotes.
scope:
  scope_ignore: ""

expected:
  # A (#8 del audit): real, pero descrito al reves y con la severidad inflada. El
  # arreglo es encolar la reanudacion ANTES de marcar la wave; el hallazgo
  # publicado dice lo contrario y su titulo se corta. `must_mention` captura la
  # direccion correcta (E16): si no aparece, el informe lo marca `tp_inverted`
  # sin mover precision ni recall. El audit lo dejo en P2 (el TTL recupera la
  # review); la review lo publico como P1.
  - id: A
    severity: P2
    subset: correctness
    file: src/agent_review/fixworker/main.py
    # 2026-10-17 (023 T2): ancla nueva al codigo de `008da57`, no a la grabacion.
    # `_consume` empieza aqui; `mark_done` (120) y `enqueue` (125) caen dentro de
    # la funcion, asi que el defecto se ancla en su entrada con un fragmento
    # discriminante (ADR-0025) y no en la linea que el modelo eligio.
    line: 95
    match: ["mark_done"]
    must_mention: ["antes de encolar la reanudacion"]

  # I: real en parte (el healthcheck queda ciego si /tmp no es escribible). La
  # severidad publicada (P3) no se discute.
  - id: I
    severity: P3
    subset: correctness
    file: src/agent_review/fixworker/main.py
    # 2026-10-17 (023 T2): el `except OSError` que se traga el fallo del latido.
    line: 166
    match: ["_touch_heartbeat", "OSError"]

  # integracion-1..3: los 3 P1 reales de integracion/configuracion que SI estaban
  # en el diff y NO se detectaron (causa: cobertura, ver 012 §3.1). No se
  # publicaron, asi que no tienen linea: casan por contenido.
  - id: integracion-1
    severity: P1
    subset: integracion
    why: "El fix-worker recibe secretos de mas via env_file: .env y solo neutraliza TWG_*"
    # 2026-10-17 (023 T2): reescrito y anclado al `env_file` del servicio. No es
    # el mismo defecto que integracion-2: aqui sobran secretos (el `.env` entero
    # llega al fix-worker y solo se neutralizan TWG_*), alli el worker no arranca
    # porque el gate de secretos exige TWG_BBC_TOKEN y se queda vacio (linea 76).
    file: docker-compose.yml
    line: 72
    match: ["fix-worker aisla solo twg_*", "github_token", "env_file"]

  - id: integracion-2
    severity: P1
    subset: integracion
    why: "El fix-worker no arranca en produccion (el gate de secretos exige TWG_BBC_TOKEN)"
    # 2026-10-17 (023 T2): la linea que vacia TWG_BBC_TOKEN. Distinto de
    # integracion-1 (fuga de secretos): este es un fallo de arranque.
    file: docker-compose.yml
    line: 76
    match: ["fixworker", "arranc"]

  - id: integracion-3
    severity: P1
    subset: integracion
    why: "MODELS_CONFIG pisa las variables LLM_* del entorno"
    # 2026-10-17 (023 T2): el default no vacio de `models_config`, que desactiva
    # la via LLM_* sin aviso. Anclado aqui para no casar el defecto de
    # settings.py:230 (R6), que es otro.
    file: src/agent_review/settings.py
    line: 155
    match: ["MODELS_CONFIG", "LLM_"]

  # no_detectado-1..3: los 3 P2 reales de codigo que la review no vio. El #5 vivia
  # en un fichero que el recorte dejo fuera (worker/main.py); el #6 y el #7, en
  # codigo que si vio. No se publicaron: casan por contenido.
  - id: no-detectado-1
    severity: P2
    subset: no_detectado
    why: "El arranque fatal-vs-warning se decide casando el texto del mensaje de probe"
    # 2026-10-17: reescrito. El `match` viejo «arranque fatal» describia el efecto y
    # no casaba el hallazgo de la regrabacion con herramientas (#7), que senala la
    # clasificacion por substring del mensaje.
    file: src/agent_review/worker/main.py
    # 2026-10-17 (023 T2): la linea que clasifica por substring del mensaje.
    line: 152
    match: ["clasifica fatales por substring del mensaje"]

  - id: no-detectado-2
    severity: P2
    subset: no_detectado
    why: "Se envia json_object aunque el modelo no declare json_mode"
    # 2026-10-17 (023 T2): `_effective_json_mode` devuelve lo pedido aunque el
    # modelo no declare la capacidad; el revisor pide json_object siempre.
    file: src/agent_review/adapters/openai_llm.py
    line: 122
    match: ["json_object", "json_mode"]

  - id: no-detectado-3
    severity: P2
    subset: no_detectado
    why: "SANDBOX_ENABLED ya no gatea el fix: la review espera al TTL"
    match: ["SANDBOX_ENABLED", "TTL"]

must_not_report:
  - id: B
    match: ["_requeue_or_drop"]
    why: "semantica inventada de verifier.py, fuera del diff"

  - id: C
    match: ["_route_fix_wait", "bucle infinito"]
    why: "el propio texto admite que el bucle es finito"

  - id: D
    match: ["run_key", "attempts"]
    why: "topologia del grafo deducida de un fragmento"

  - id: E
    match: ["fix_max_attempts", "max_fix_attempts_job"]
    why: "confunde max_fix_attempts con max_fix_attempts_job"

  - id: F
    match: ["build_fix_wait", "targets"]
    why: "afirma una regresion sin comparar con el base_sha"

  - id: G
    match: ["apply_resolutions", "NOT_VERIFIABLE"]
    why: "requisito inventado sin leer verify_job"

  # J-O: falsos positivos de la regrabacion del 2026-10-17 (deepseek-v4-flash, con
  # el contrato de 007). Verificados contra 008da57; todos traen escenario de
  # fallo, pero el escenario no es alcanzable.
  - id: J
    file: src/agent_review/graph/build.py
    match: ["`fix_wait` no tiene", "retry_policy"]
    why: "fix_wait es puro y va sin RetryPolicy a proposito (como hitl); un ValidationError tampoco se reintentaria"

  - id: K
    file: src/agent_review/fixworker/main.py
    match: ["`done_keys` vacío", "encola la reanudación"]
    why: "una wave vacia nunca se encola: build_fix_wait devuelve None sin PENDING con parche"

  - id: L
    file: src/agent_review/graph/build.py
    match: ["comentario de seguimiento del fix", "parcialmente resuelto"]
    why: "apply_resolutions cierra todo PENDING sin resolucion: publish_fix nunca ve una wave a medias"

  - id: M
    file: src/agent_review/fixworker/main.py
    match: ["no propaga `sandboxerror` transitorio"]
    why: "los 5xx/429/timeouts son SandboxUnavailable (transitorio, hermano de SandboxError): suben y se reencolan"

  - id: N
    file: src/agent_review/fix/node.py
    match: ["`dispatch_fixes` re-propone", "terminales previos"]
    why: "devolver el delta es el contrato; el reducer _merge_fixes conserva los terminales (escenario hipotetico)"

  - id: O
    file: src/agent_review/graph/build.py
    match: ["puede no converger", "que no avanza"]
    why: "una excepcion aborta fix_dispatch y no llega a _route_fix_wait; cada vuelta consume un intento (familia de C)"

  # P2-P9: falsos positivos de la regrabacion con lotes (012, 2026-10-17). Con la
  # cobertura completa el modelo ve el worker y el fix-worker y fabrica fallos de
  # orquestacion no alcanzables. Verificados contra 008da57.
  - id: P2
    file: src/agent_review/worker/main.py
    match: ["sweep_fix_expired usa review.fix_request sin comprobar none"]
    why: "fix_request nunca es None: lanza TypeError y la unica pausa FIX se crea con un FixWaitRequest"

  - id: P3
    file: src/agent_review/worker/main.py
    match: ["no comprueba si la pausa ya fue marcada como expirada"]
    why: "PausedStore.sweep filtra con _is_due: una pausa ya encolada no vuelve hasta EXPIRED_REQUEUE_AFTER_S"

  - id: P4
    file: src/agent_review/fix/node.py
    match: ["usa result.attempts como attempt del run_key"]
    why: "una reentrega con el hilo pausado en fix_wait es un no-op y un PENDING nunca se re-propone: attempts no cambia"

  - id: P5
    file: src/agent_review/graph/build.py
    match: ["fix_wait re-pausa con la misma wave"]
    why: "fix_wait no re-pausa y verify_job emite una resolucion por job (o se reencola); el propio texto admite que no hay ciclo"

  - id: P6
    file: src/agent_review/worker/main.py
    match: ["validate_models solo es fatal si hay bindings"]
    why: "sin bindings no hay persona LLM: un modelo sin binding nunca se usa"

  - id: P7
    file: src/agent_review/settings.py
    match: ["insecure_secrets silencia errores de carga"]
    why: "un YAML roto ya falla al arrancar en build_registry; el comentario lo documenta"

  - id: P8
    file: src/agent_review/worker/main.py
    match: ["_resolution_matches acepta cualquier resolucion si pending esta vacio"]
    why: "pending nunca esta vacio (solo se despacha con wave) y apply_resolutions indexa por run_key"

  - id: P9
    match: ["api key de nan.builders expuesta"]
    why: "es la tarea humana P7 ya registrada en el todo; el diff no contiene ninguna clave"

  # P10-P14: FP de la regrabacion con razonamiento alto, lotes de 20k y troceo por
  # hunks (021, 2026-10-17). Verificados contra 008da57.
  - id: P10
    file: src/agent_review/worker/main.py
    match: ["sweep_fix_expired lee review.fix_request"]
    why: "fix_request es una propiedad sobre approval: el mismo campo, y el barrido filtra por kind FIX (familia de P2)"

  - id: P11
    match: ["security/arch desaparecen sin error"]
    why: "que un rol sin binding no construya su persona es decision documentada de 005 (D7, M6)"

  - id: P12
    file: config/models.yaml
    match: ["exige 'json' en su propio prompt"]
    why: "el system prompt del fixer ya dice JSON y el adaptador lo anade si falta"

  - id: P13
    file: src/agent_review/worker/main.py
    match: ["puede marcar not_verifiable un fix ya verificado"]
    why: "el barrido solo corre con la cola vacia y apply_resolutions solo toca PENDING (familia de P3 y K)"

  - id: P14
    file: src/agent_review/worker/main.py
    match: ["_ensure_registered re-encola la wave"]
    why: "el set done vive en Redis (24 h) y sobrevive al reinicio; la reposicion es idempotente y documentada"

  # R1-R5: FP de la regrabacion con herramientas (014 RH10, 2026-10-17). Con L1
  # completo y el bucle de lectura el modelo ve el worker entero y reescribe (o
  # duplica) fallos de orquestacion no alcanzables. Verificados contra 008da57.
  - id: R1
    file: src/agent_review/worker/main.py
    match: ["build_fix_queue no se cablea"]
    why: "run_forever:1070 lo construye (fix_queue = fix_queue or build_fix_queue) y lo pasa a _consume en 1097 y a reconcile_paused en 1121 (familia de Q4)"

  - id: R2
    file: src/agent_review/worker/main.py
    match: ["no pasa fix_queue"]
    why: "el mismo error por otra linea (621): _consume recibe fix_queue desde run_forever:1097; la pausa de fix si encola la wave"

  - id: R3
    file: src/agent_review/graph/build.py
    match: ["tope de intentos distinto"]
    why: "el router y el dispatcher leen el mismo guards.max_fix_attempts; state[fijo] no se escribe, asi que el default 2 coincide (familia de C y O)"

  - id: R4
    file: src/agent_review/domain/models.py
    match: ["referencia reviewrequest definido despues"]
    why: "con `from __future__ import annotations` pydantic difiere el forward ref y lo resuelve al construir el modelo (que construye FixJob)"

  - id: R5
    file: config/models.yaml
    match: ["exige la palabra json en el prompt"]
    why: "el system prompt del fixer (llm_fixer.py:16) ya dice «JSON valido» y el adaptador fuerza json_object (familia de P12)"

  - id: R6
    file: src/agent_review/settings.py
    # 2026-10-17 (023 T2): ancla al `except Exception` que traga el registro
    # ilegible (230). Separado de integracion-3 (155), que es el default de
