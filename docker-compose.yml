services:
  api:
    build: .
    command: uvicorn reviews.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reviews:reviews@postgres:5432/reviews
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reviews

  worker:
    build: .
    command: python -m reviews.worker.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reviews:reviews@postgres:5432/reviews
      REDIS_URL: redis://redis:6379/0
      # El worker necesita invocar twg dentro del contenedor.
      TWG_BIN: twg
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reviews

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reviews
      POSTGRES_PASSWORD: reviews
      POSTGRES_DB: reviews
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviews"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - reviews

  redis:
    image: redis:7-alpine
    networks:
      - reviews

volumes:
  pg_data:

networks:
  reviews:
    driver: bridge
