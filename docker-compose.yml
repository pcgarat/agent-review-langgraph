services:
  api:
    build: .
    restart: unless-stopped
    command: uvicorn agent_review.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reviews:${POSTGRES_PASSWORD:-reviews}@postgres:5432/reviews
      REDIS_URL: redis://redis:6379/0
    volumes:
      # La API deposita aqui los artefactos que el worker lee (Fase 1).
      - ./var:/app/var
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - reviews

  worker:
    build: .
    restart: unless-stopped
    command: python -m agent_review.worker.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reviews:${POSTGRES_PASSWORD:-reviews}@postgres:5432/reviews
      REDIS_URL: redis://redis:6379/0
      # El worker necesita invocar twg dentro del contenedor.
      TWG_BIN: twg
      # Credencial de servicio de twg (Bitbucket/Jira). Llega por `env_file: .env`
      # como TWG_BBC_TOKEN/TWG_SITE/TWG_USER/TWG_TOKEN: no hay fichero de auth en
      # el contenedor ni montaje del ~/.config/twg del host.
      # La credencial de clonado del motor claude vive en `claude-runner`.
      # Vaciarla aquí gana a `env_file`: el proceso que publica no la tiene.
      CLAUDE_GIT_TOKEN: ""
      CLAUDE_RUNNER_URL: ${CLAUDE_RUNNER_URL:-http://claude-runner:8098}
      # Enlace del aviso si falta la sesión. El worker no monta el fichero.
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-http://localhost:8090}
      # Fuera de `./var`: ese bind es :ro y runc no puede crear un punto de
      # montaje dentro. El default `var/claude` vale fuera de compose.
      CLAUDE_ARTIFACT_ROOT: /var/claude-artifacts
    volumes:
      - ./config:/app/config:ro
      # Artefactos con la salida de herramientas del CI (Fase 1, solo lectura).
      - ./var:/app/var:ro
      # JSON ya validado del motor claude. Volumen propio, no anidado en `./var`.
      - claude_artifacts:/var/claude-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # El worker no escucha: un hilo de latido refresca este fichero cada pocos
      # segundos. Un fichero viejo o ausente = proceso vivo pero colgado (o muerto).
      test: ["CMD", "python", "-c", "import os, time, sys; p='/tmp/reviews-worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - reviews

  # Fase 3-E7: worker de fixes. Proceso aparte del worker de reviews: consume la
  # wave de `reviews:fixes`, la verifica con el sandbox-runner y encola la
  # reanudacion en `reviews:jobs`. Vive AISLADO: no monta `docker.sock`, no tiene
  # `TWG_*` ni el token de decision, no habla con Postgres y NO publica nada en el
  # PR (un unico escritor: el worker de reviews). Solo necesita Redis y el runner.
  fix-worker:
    build: .
    restart: unless-stopped
    command: python -m agent_review.fixworker.main
    # Sin `env_file`: el `.env` lleva todos los secretos del despliegue (token de
    # escritura del PR, token de decision, clave del LLM...). Solo se le pasa lo
    # que lee, interpolado desde el `.env` del host; el resto queda en su valor
    # por defecto (la imagen no incluye `.env`).
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_TIMEOUT_S: ${SANDBOX_TIMEOUT_S:-1200}
      REPO_PROFILE_CONFIG: ${REPO_PROFILE_CONFIG:-config/repo_profile.emotivoo-v2.yaml}
      MAX_FIX_ATTEMPTS_JOB: ${MAX_FIX_ATTEMPTS_JOB:-3}
      FIX_POLL_S: ${FIX_POLL_S:-5}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_started
      sandbox-runner:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time, sys; p='/tmp/reviews-fix-worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - reviews

  # Fase 3: verifica el parche de un fix con la imagen del CI por digest. Executa
  # codigo de PRs de terceros, asi que vive AISLADO: no monta ningun socket de
  # Docker del host (habla con su propio demonio rootless via el CLI `docker`),
  # no publica puertos y solo es alcanzable por el worker en la red interna.
  sandbox-runner:
    build:
      context: .
      args:
        SANDBOX_RUNNER: "true"
    restart: unless-stopped
    command: python -m agent_review.sandbox_runner.main
    env_file: .env
    environment:
      # El runner no revisa nada: no necesita las credenciales de Bitbucket del
      # worker (TWG_*). Solo clona con su token de solo lectura y ejecuta la imagen.
      TWG_BBC_TOKEN: ""
      # Workspaces de lectura (iniciativa 016): TTL de un clon *bare* abierto y
      # tope de clones simultaneos. Explicito aqui porque solo el runner los
      # aplica; el valor del `.env` los puede subir.
      SANDBOX_WORKSPACE_TTL_S: ${SANDBOX_WORKSPACE_TTL_S:-1800}
      SANDBOX_MAX_WORKSPACES: ${SANDBOX_MAX_WORKSPACES:-4}
    volumes:
      - ./config:/app/config:ro
      # El socket del demonio DEDICADO del runner (rootless), en el path por
      # defecto del CLI. Nunca el del worker ni el del host con privilegios.
      - /run/user/1000/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - reviews
    # Sin `ports`: solo alcanzable por el worker dentro de la red de compose.

  # Motor claude (025, ADR-0028). Opt-in: sin el perfil, `docker compose up`
  # sigue siendo el motor llm. Checkout en un volumen propio, no el clon bare
  # del sandbox-runner. Sin `env_file`: no hereda el token con el que el
  # worker publica. El subproceso `claude` tampoco recibe la credencial de
  # clonado (el proceso la usa para el fetch y luego quita el remoto).
  claude-runner:
    build:
      context: .
      target: claude-runner
    restart: unless-stopped
    profiles: ["claude"]
    command: python -m agent_review.claude_runner.main
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REVIEW_ENGINE: claude
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_MAX_TURNS: ${CLAUDE_MAX_TURNS:-30}
      CLAUDE_TIMEOUT_S: ${CLAUDE_TIMEOUT_S:-900}
      CLAUDE_WORKSPACE_ROOT: /var/claude-checkout
      CLAUDE_RUNNER_PORT: ${CLAUDE_RUNNER_PORT:-8098}
      CLAUDE_RUNNER_TOKEN: ${CLAUDE_RUNNER_TOKEN:-}
      # Vacio: el fetch reutiliza el token de VCS (ADR-0032). Un valor propio
      # es el override de solo lectura y es lo unico que ve este proceso con
      # ese nombre. El worker lo recibe vacio.
      CLAUDE_GIT_TOKEN: ${CLAUDE_GIT_TOKEN:-}
      VCS_PROVIDER: ${VCS_PROVIDER:-twg}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TWG_BBC_TOKEN: ${TWG_BBC_TOKEN:-}
      CLAUDE_SESSION_PATH: /var/claude-session/session.json
    volumes:
      - claude_checkout:/var/claude-checkout
      - claude_session:/var/claude-session
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port=os.environ.get('CLAUDE_RUNNER_PORT','8098'); urllib.request.urlopen(f'http://localhost:{port}/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - reviews
    # Sin `ports`: solo el worker, en la red interna.

  # Canal de Teams (iniciativa 013): el bot con hilo por PR. Consume la outbox
  # (`reviews:notices`) y sirve el *messaging endpoint* `POST /api/messages` del
  # Bot Framework. Vive aislado del worker: NO tiene credencial de VCS ni clave del
  # LLM; solo Redis y la identidad del bot. El *messaging endpoint* se expone por el
  # ingress/TLS de operacion, no aqui (T10): sin `ports`, solo alcanzable dentro de
  # la red de compose hasta que el ingress lo publique.
  teams-bot:
    build: .
    restart: unless-stopped
    command: python -m agent_review.teams_bot.main
    # Sin `env_file`: el `.env` lleva todos los secretos del despliegue (token de
    # escritura del PR, clave del LLM...). El bot solo recibe lo que lee.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TEAMS_ENABLED: ${TEAMS_ENABLED:-false}
      REDIS_URL: redis://redis:6379/0
      TEAMS_NOTICES_KEY: ${TEAMS_NOTICES_KEY:-reviews:notices}
      TEAMS_BOT_POLL_S: ${TEAMS_BOT_POLL_S:-5}
      TEAMS_BOT_ID: ${TEAMS_BOT_ID:-}
      TEAMS_BOT_TENANT_ID: ${TEAMS_BOT_TENANT_ID:-}
      TEAMS_BOT_TOKEN: ${TEAMS_BOT_TOKEN:-}
      TEAMS_BOT_PORT: ${TEAMS_BOT_PORT:-3978}
      TEAMS_BOT_SHARED_SECRET: ${TEAMS_BOT_SHARED_SECRET:-change-me}
      DECISION_TTL_S: ${DECISION_TTL_S:-604800}
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port=os.environ.get('TEAMS_BOT_PORT','3978'); req=urllib.request.Request(f'http://localhost:{port}/healthz', headers={'Authorization': 'Bearer ' + os.environ.get('TEAMS_BOT_SHARED_SECRET','')}); urllib.request.urlopen(req).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - reviews
    # Sin `ports`: el ingress/TLS de operacion es quien lo publica (T10).

  # Panel de operacion (iniciativa 019, W1). Servicio de lectura y comandos, opt-in
  # por el perfil `panel`: sin el perfil, `docker compose up` arranca lo de siempre
  # (R7). Como el `fix-worker` y el `teams-bot`, NO hereda el `.env` entero (nada de
  # `env_file`): el panel lee estado y encola comandos, asi que no recibe credencial
  # de VCS ni clave del LLM (§5.8). Si recibe el nombre del repo (sin token) para
  # rechazar la URL de otro repositorio al lanzar una review (ADR-0029). Solo Redis,
  # Postgres (lectura) y su sesion.
  web:
    build: .
    restart: unless-stopped
    profiles: ["panel"]
    command: python -m agent_review.web.main
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PANEL_ENABLED: ${PANEL_ENABLED:-true}
      REVIEW_ENGINE: ${REVIEW_ENGINE:-llm}
      PANEL_PORT: ${PANEL_PORT:-8090}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET:-}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://reviews:${POSTGRES_PASSWORD:-reviews}@postgres:5432/reviews
      PROGRESS_KEY: ${PROGRESS_KEY:-reviews:active}
      CANCEL_TTL_S: ${CANCEL_TTL_S:-604800}
      # Proxy de la consola en vivo del sandbox (OP24): el panel reenvia el SSE del
      # runner con el bearer de **solo lectura** de la consola, que el navegador no
      # recibe. No lleva `SANDBOX_RUNNER_TOKEN`: ese tambien autoriza `POST /verify`.
      # Sin URL o sin token, la consola responde `404`.
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-}
      SANDBOX_CONSOLE_TOKEN: ${SANDBOX_CONSOLE_TOKEN:-}
      # Los diales del panel se comparan contra el valor inicial del worker, que
      # lee el `.env` entero. Compose interpola estas variables del mismo `.env`,
      # asi que los dos procesos resuelven el mismo inicial y el mismo candado.
      # Un dial que falte aqui pinta el default del codigo mientras el worker usa
      # el del `.env`: `tests/test_compose.py` exige el catalogo entero (027,
      # ADR-0031). Ninguno es un secreto.
      PANEL_CONFIG_LOCK: ${PANEL_CONFIG_LOCK:-}
      AUTONOMY_CONFIG: ${AUTONOMY_CONFIG:-config/autonomy.yaml}
      MAX_AUTONOMY_OVERRIDE: ${MAX_AUTONOMY_OVERRIDE:-}
      SCOPE_IGNORE: ${SCOPE_IGNORE:-}
      LLM_MAX_FINDINGS: ${LLM_MAX_FINDINGS:-10}
      LLM_BUDGET_TOKENS_PER_PR: ${LLM_BUDGET_TOKENS_PER_PR:-2000000}
      LLM_BATCH_MAX_CHARS: ${LLM_BATCH_MAX_CHARS:-20000}
      LLM_BATCH_RETRIES: ${LLM_BATCH_RETRIES:-2}
      LLM_CONTEXT_MAX_CHARS: ${LLM_CONTEXT_MAX_CHARS:-40000}
      VERIFIER_MAX_FINDINGS: ${VERIFIER_MAX_FINDINGS:-5}
      VERIFIER_MAX_TOOL_CALLS: ${VERIFIER_MAX_TOOL_CALLS:-8}
      VERIFIER_MAX_CONTEXT_BYTES: ${VERIFIER_MAX_CONTEXT_BYTES:-60000}
      VERIFIER_REQUIRE_VERIFIED_FOR: ${VERIFIER_REQUIRE_VERIFIED_FOR:-P0,P1}
      REVIEW_TOOLS_ROLES: ${REVIEW_TOOLS_ROLES:-}
      REVIEW_TOOLS_MAX_TURNS: ${REVIEW_TOOLS_MAX_TURNS:-4}
      REVIEW_TOOLS_MAX_CALLS: ${REVIEW_TOOLS_MAX_CALLS:-8}
      REVIEW_TOOLS_MAX_BYTES: ${REVIEW_TOOLS_MAX_BYTES:-60000}
      REVIEW_TOOLS_GREP_MODE: ${REVIEW_TOOLS_GREP_MODE:-literal}
      REVIEW_TOOLS_READ_OUTLINE: ${REVIEW_TOOLS_READ_OUTLINE:-false}
      REVIEW_TOOLS_READ_STATE: ${REVIEW_TOOLS_READ_STATE:-false}
      REVIEW_TOOLS_TRUNCATION_NOTICE: ${REVIEW_TOOLS_TRUNCATION_NOTICE:-true}
      REVIEW_TOOLS_STRICT_CALLS: ${REVIEW_TOOLS_STRICT_CALLS:-false}
      REVIEW_TOOLS_CALLS_PER_TURN: ${REVIEW_TOOLS_CALLS_PER_TURN:-3}
      REVIEW_TOOLS_PRECACHE_CONTEXT: ${REVIEW_TOOLS_PRECACHE_CONTEXT:-true}
      REVIEW_TOOLS_IO_CACHE: ${REVIEW_TOOLS_IO_CACHE:-false}
      # Identidad del repo, sin el token: el panel rechaza la URL de otro repo
      # y el worker es quien lee el commit (ADR-0029).
      VCS_PROVIDER: ${VCS_PROVIDER:-twg}
      BITBUCKET_WORKSPACE: ${BITBUCKET_WORKSPACE:-}
      BITBUCKET_REPO: ${BITBUCKET_REPO:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      # Misma ruta que claude-runner. El token no es una variable de entorno.
      CLAUDE_SESSION_PATH: /var/claude-session/session.json
      CLAUDE_SESSION_TTL_S: ${CLAUDE_SESSION_TTL_S:-43200}
    volumes:
      - claude_session:/var/claude-session
      # Solo lectura: el techo de autonomia de un override publicado se valida
      # contra `config/autonomy.yaml`. Sin este montaje, cualquier guardado con
      # `MAX_AUTONOMY_OVERRIDE` responde 400. Los YAML siguen siendo de git: el
      # panel no los edita (ADR-0031).
      - ./config:/app/config:ro
    ports:
      # Solo se publica cuando el perfil `panel` esta activo.
      - "${PANEL_PORT:-8090}:${PANEL_PORT:-8090}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port=os.environ.get('PANEL_PORT','8090'); urllib.request.urlopen(f'http://localhost:{port}/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - reviews

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviews
      # Contrasena parametrizable: en local vale el default; en un despliegue se
      # inyecta POSTGRES_PASSWORD por entorno (p. ej. desde los secretos).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviews}
      POSTGRES_DB: reviews
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviews"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - reviews

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reviews

volumes:
  pg_data:
  claude_artifacts:
  claude_checkout:
  claude_session:

networks:
  reviews:
    driver: bridge
