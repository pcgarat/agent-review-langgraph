version: 1
# Techo global de autonomia. Sube o baja sin tocar el grafo.
# report | fix_with_approval | fix_auto
# Fase 1 (report-only): todo se degrada a report, incluido escalate.
max_autonomy: report

default_action: report

# Gate de severidad (011 / 009 VF15). El nodo `verify` (L2) ya consume
# `require_verified_for` como umbral de candidatos. `on_unverified` / `on_refuted`
# / `degrade_to` los aplica el motor cuando 011 aterrice; hasta entonces son
# declaracion de politica (no se aplican en publish).
severity_gate:
  require_verified_for: [P0, P1]    # tambien umbral de candidatos de L2 (G9)
  verified: [verified_static, verified_grounded, verified_executed]
  on_unverified: degrade           # degrade | possibles (011 Q1)
  degrade_to: P3
  on_refuted: drop                 # drop | summary (011 Q9); nunca inline

# Se evaluan en orden; gana la primera regla que casa.
# Campos: protected_subject, severity, autofix_class, confidence, paths
rules:
  - when:
      protected_subject: "*"
    action: escalate
    reason: "Tema protegido: requiere criterio humano"

  - when:
      severity: P0
    action: escalate
    reason: "Fallo critico"

  - when:
      autofix_class: manual
    action: escalate
    reason: "Decision de diseno o de negocio"

  - when:
      autofix_class: advisory
    action: report

  - when:
      confidence: [0, 25, 50]
    action: report

  - when:
      autofix_class: gated_auto
      severity: [P1, P2]
    action: fix_with_approval

  - when:
      autofix_class: gated_auto
      severity: P3
      confidence: [75, 100]
    action: fix_auto

guards:
  max_inline_comments: 20
  never_auto_paths:
    - ".github/**"
    - "infra/**"
    - "migrations/**"
    - "**/auth/**"
    - "**/security/**"
    - "docker/**"
    - "bitbucket-pipelines.yml"
  require_tests_pass: true
  max_fix_attempts: 2
  max_fixes_per_pr: 3
  max_fix_lines: 30
  dedupe_by: [file, title]
