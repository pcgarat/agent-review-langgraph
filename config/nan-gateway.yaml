# Pasarela Anthropic → OpenAI del clúster (032). La clave de NaN no está aquí:
# el proceso la lee de NAN_API_KEY. El master_key es LITELLM_MASTER_KEY, que el
# entrypoint lee de /run/gateway/token: el mismo fichero que usa claude-runner.
model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://api.nan.builders/v1
      api_key: os.environ/NAN_API_KEY
  - model_name: glm5.3-flash
    litellm_params:
      model: openai/glm5.3-flash
      api_base: https://api.nan.builders/v1
      api_key: os.environ/NAN_API_KEY

litellm_settings:
  drop_params: true
  success_callback: []
  failure_callback: []

# Solo el 429 se repite dentro de la llamada. El resto falla y el worker
# reencola el job. Tres reintentos: agotados, deja de ser un fallo de esta
# petición y no se parkea como cupo de Anthropic.
router_settings:
  num_retries: 0
  retry_policy:
    RateLimitErrorRetries: 3
    DefaultRetries: 0
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    InternalServerErrorRetries: 0
    ServiceUnavailableErrorRetries: 0
    NotFoundErrorRetries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
