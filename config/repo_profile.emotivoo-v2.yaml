# Perfil del repositorio emotivoo-v2.
# Deriva de bitbucket-pipelines.yml. Es el contrato que el sandbox ejecuta.
# La clave es EXEC_PHP="": en local es `docker compose exec php`, en CI es vacio.
# Ver docs/iniciativas/archivo/001-diseno-base/spec.md, apartado 15.

repo: cqm/emotivoo-v2
language: php 8.4
framework: symfony 7.4
package_manager: composer
ci_image: crg.apkg.io/cqm/emotivoo-v2/emotivoo-ci:latest
# Digest inmutable de `ci_image` (sha256:...), obligatorio para verificar un fix.
# Un tag mutable (`:latest`) permitiria que la verificacion corriera con una
# imagen distinta de la declarada (R3). Lo fija ops a mano (o por un job) cuando
# cambia `Dockerfile.ci`; vacio = verificacion deshabilitada (NOT_VERIFIABLE).
ci_image_digest: ""
source: bitbucket-pipelines.yml

env:
  EXEC_PHP: ""
  APP_ENV: test

# `setup_network`: solo lo que necesita descargar algo. Corre ANTES que `setup`.
# - `composer install --no-scripts`: baja dependencias sin ejecutar codigo del PR.
# - `importmap:install`: baja los paquetes JS del CDN. Arranca el kernel (codigo
#   del PR) con red: riesgo asumido, porque sin ellos fallan los tests funcionales
#   que renderizan plantillas. Si deja de hacer falta, se mueve a `setup`.
setup_network:
  - composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress --no-scripts
  - bin/console importmap:install -n
# `setup`: el resto, con `--network none` como los checks. `cache:clear` regenera
# la cache que necesita `stan` y `assets:install` copia assets desde `vendor/`;
# ninguno descarga nada.
setup:
  - bin/console cache:clear -n
  - bin/console assets:install -n

checks:
  lint: make cs-check
  typecheck: make stan
  arch: make deptrac
  # Tests dirigidos por rutas (Q2, ver abajo). `bin/phpunit` autodescubre
  # `phpunit.dist.xml` (PHPUnit 10.1+), asi que hereda failOnDeprecation/Notice/
  # Warning, el bootstrap y APP_ENV=test sin pasar `-c`. `{targets}` se sustituye
  # por rutas de test validadas por el runner; si vienen vacias, la recipe se salta.
  targeted: "bin/phpunit {targets}"
  tests: make test

# Orden de verificacion. `targeted` va antes de `typecheck` a proposito: da la
# senal mas barata y local (tests del area tocada) antes de la mas cara, y las
# reglas custom de PHPStan (ApplicationServiceMustHaveTestRule) exigen el test
# que el fix ya deberia traer. Fiel al pre-commit (§15.3), ampliado con CI.
verify: [targeted, typecheck, arch, lint, tests]

# Herramientas cuya salida espera la review antes de ejecutarse (barrera de ingesta).
expected_tools:
  - phpstan

extra_checks:
  rector: make rector-check
  mutation: make mutation-diff

caches:
  vendor:
    key: composer.lock
    path: vendor
  tailwind:
    key: config/packages/symfonycasts_tailwind.yaml
    path: var/tailwind

sandbox:
  base_image: crg.apkg.io/cqm/emotivoo-v2/emotivoo-ci:latest
  # El digest es lo unico que se acepta para verificar (R3): el tag de al lado es
  # informativo. `ci_image_digest` vacio en la cabecera = verificacion deshabilitada.
  network: allowlist
  timeout_s: 1200
