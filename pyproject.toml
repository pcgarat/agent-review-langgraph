[project]
name = "reviews"
version = "0.1.0"
description = "Agente autonomo de code review sobre LangGraph"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=5.2",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviews"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: requiere twg autenticado y red contra Bitbucket (excluido por defecto)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
