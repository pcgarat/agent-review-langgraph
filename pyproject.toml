[project]
name = "agent-review-langgraph"
version = "0.1.0"
description = "Agente autonomo de code review sobre LangGraph"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "redis>=5.2",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    # Canal de Teams (iniciativa 013): el SDK del *messaging endpoint* del Bot
    # Framework. Version fijada por minor: es muy nuevo y puede romper en un
    # cambio menor. Solo lo importa `agent_review.teams_bot.sdk_client`.
    "microsoft-teams-apps>=2.1,<2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    # Redis falso con soporte de scripts Lua: prueba el adaptador de presupuesto
    # (017) sin un servidor real.
    "fakeredis[lua]>=2.26",
]

[project.scripts]
agent_review = "agent_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_review"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Los fixtures del gold set son copias literales del repo a un sha (014 Q4): se
# versionan para el replay y no son codigo de este repo, asi que no se lintean ni
# se formatean. Tocarlos cambiaria los bytes que el caso sirve.
extend-exclude = ["tests/eval/pr_3/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
# El servicio `teams-bot` (iniciativa 013) tiene handlers async; con `auto`,
# `async def test_...` no necesita el decorador `pytest.mark.asyncio`.
asyncio_mode = "auto"
markers = [
    "live: requiere credenciales reales y red (twg autenticado, LLM_API_KEY); excluido por defecto",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
