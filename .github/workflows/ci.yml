name: CI

on:
  pull_request:

env:
  # Fuerza la version de Python en todos los comandos uv del job.
  UV_PYTHON: "3.12"
  # Falla si uv.lock no refleja pyproject.toml, evitando builds no reproducibles.
  UV_FROZEN: "true"

jobs:
  ci:
    name: Lint, tipado y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python
        run: uv python install 3.12

      - name: Sincronizar dependencias (con extras dev)
        run: uv sync --extra dev

      # Panel en React (029): mismos comandos que `make frontend-check`. El build
      # no se versiona, asi que CI instala desde el lock y compila de verdad.
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Panel · dependencias
        run: npm ci --prefix frontend

      - name: Panel · tipos
        run: npm run typecheck --prefix frontend

      - name: Panel · lint
        run: npm run lint --prefix frontend

      - name: Panel · tests
        run: npm test --prefix frontend

      - name: Panel · build
        run: npm run build --prefix frontend

      - name: Ruff (lint)
        run: uv run --extra dev ruff check src tests scripts

      - name: Ruff (formato)
        run: uv run --extra dev ruff format --check src tests scripts

      - name: Mypy
        run: uv run --extra dev mypy

      - name: Pytest
        run: uv run --extra dev pytest

      - name: Documentacion
        run: uv run --extra dev python scripts/check_docs.py
